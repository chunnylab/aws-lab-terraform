name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: fmt, init, validate every module
        run: |
          set -euo pipefail
          status=0
          for d in modules/bastion-pair labs/*; do
            echo "::group::$d"
            ( cd "$d"
              terraform init -backend=false -input=false >/dev/null
              terraform fmt -check
              terraform validate
            ) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: design guards
        run: bash scripts/guards.sh
