<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
    <!-- หน้าแมวตัวเอกของ Indy Cat ซูมมาจากสไปรต์ตัวเดียวกับที่ยืนอยู่ในวอลเปเปอร์
         หน้า /wallpapers — ครอปแถว 3–9 คอลัมน์ 9–13 ของกริด SIT ขนาด 16×16
         พื้นหลังไล่ขั้นด้วยฟ้า sunset ชุดเดียวกับวอลเปเปอร์ (ครึ่งอุ่น)
         สร้างด้วย scripts/build-favicon.mjs อย่าแก้ด้วยมือ -->
    <g>
        <rect y="0" width="8" height="2" fill="#95505a" />
        <rect y="2" width="8" height="2" fill="#c06a52" />
        <rect y="4" width="8" height="2" fill="#e08a4c" />
        <rect y="6" width="8" height="2" fill="#f0a94e" />
    </g>
    <g fill="#17171f">
        <rect x="2.5" y="1" width="1" height="1" />
        <rect x="4.5" y="1" width="1" height="1" />
        <rect x="2.5" y="2" width="1" height="1" />
        <rect x="4.5" y="2" width="1" height="1" />
        <rect x="1.5" y="3" width="5" height="1" />
        <rect x="1.5" y="4" width="2" height="1" />
        <rect x="4.5" y="4" width="2" height="1" />
        <rect x="1.5" y="5" width="3" height="1" />
        <rect x="1.5" y="6" width="3" height="1" />
        <rect x="1.5" y="7" width="3" height="1" />
    </g>
    <g fill="#ff9736">
        <rect x="3.5" y="4" width="1" height="1" />
    </g>
    <g fill="#f2ede4">
        <rect x="4.5" y="5" width="1" height="1" />
    </g>
    <g fill="#e8909c">
        <rect x="5.5" y="5" width="1" height="1" />
    </g>
</svg>
